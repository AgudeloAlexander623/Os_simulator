[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "os-simulator"
version = "1.0.0"
description = "Simulador de sistema operativo con scheduling, memoria y concurrencia"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Educational Use License"}
authors = [
    {name = "Jessid Alexander Agudelo"},
]
keywords = ["os", "scheduler", "simulator", "processes", "memory"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Intended Audience :: Education",
    "Topic :: Education",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "rich>=13.0",
]

[project.scripts]
os-sim = "main:main"

[tool.pytest.ini_options]
testpaths = ["test"]

[tool.coverage.run]
source = ["core", "controllers", "concurrency", "utils"]
